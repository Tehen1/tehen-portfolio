name: Temporary lockfile regeneration (security patch)

on:
  push:
    branches:
      - "security/p0-nextjs-15-lockfile-20261022"

permissions:
  contents: write

concurrency:
  group: lockfile-regeneration-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.actor == 'Tehen1' && github.ref == 'refs/heads/security/p0-nextjs-15-lockfile-20261022'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4
        with:
          version: "9.15.4"
          run_install: false

      - name: Regenerate lockfile from workspace manifests
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify frozen lockfile contract
        run: pnpm install --lockfile-only --frozen-lockfile

      - name: Check whitespace errors
        run: git diff --check

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): regenerate pnpm lockfile"
          git push
